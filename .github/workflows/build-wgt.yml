name: Build Tidalizen WGT

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ '*' ]

permissions:
  contents: write

jobs:
  build-wgt:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip

      - name: Install Tizen Studio Web CLI
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 5 \
            -o tizen-installer \
            "https://download.tizen.org/sdk/Installer/tizen-studio_4.5.1/web-cli_Tizen_Studio_4.5.1_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "$GITHUB_WORKSPACE/tizen-studio"
          echo "$GITHUB_WORKSPACE/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/tizen-studio/tools" >> "$GITHUB_PATH"

      - name: Verify repo
        run: node tools/verify-repo.mjs

      - name: Build web package
        run: |
          set -euo pipefail
          cd app
          "$GITHUB_WORKSPACE/tizen-studio/tools/ide/bin/tizen" build-web \
            -e ".*" \
            -e "node_modules/*" \
            -e "package*.json"
          test -d .buildResult

      - name: Package WGT
        run: |
          set -euo pipefail
          mkdir -p app/release
          rm -f app/release/*.wgt app/release/*.json
          node tools/package-manual-wgt.mjs app/.buildResult app/release/Tidalizen.wgt
          ls -lah app/release
          test -s app/release/Tidalizen.wgt

      - name: Verify WGT structure
        run: node tools/verify-wgt.mjs app/release/Tidalizen.wgt debug | tee app/release/wgt-metadata.json

      - name: Upload WGT artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tidalizen-wgt
          path: app/release/Tidalizen.wgt
          if-no-files-found: error

      - name: Release WGT on tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/release/Tidalizen.wgt
